name: Restore panel-api
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-panel-api.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore panel-api from c212da2
        run: |
          git checkout c212da2 -- frontend/src/lib/panel-api.ts
          # ensure time-off helpers exist (may already be in that revision)
          if ! grep -q 'fetchMyTimeOffs' frontend/src/lib/panel-api.ts; then
            echo 'WARNING: fetchMyTimeOffs missing in c212da2 copy'
          fi
          wc -c frontend/src/lib/panel-api.ts
          grep -c 'export async function' frontend/src/lib/panel-api.ts
      - name: Commit
        run: |
          git config user.name "Beautijoo Bot"
          git config user.email "bot@beautijoo.ir"
          git add frontend/src/lib/panel-api.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(frontend): restore full panel-api.ts from c212da2"
          git push origin main
