name: Sync backend deployment branch

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/sync-backend-deploy-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split backend subtree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=backend --branch=backend-deploy-sync

      - name: Update backend deployment branch
        run: |
          git push origin backend-deploy-sync:beautijoo-backend-export --force
