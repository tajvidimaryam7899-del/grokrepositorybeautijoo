name: Fix Admin Relations
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/admin/admin.service.ts')
          s = p.read_text()
          old1 = "_count: { select: { bookings: true, reviews: true, services: true } }"
          new1 = "_count: { select: { bookings: true, reviews: true, professionalServices: true } }"
          old2 = "        services: { include: { service: true } },"
          new2 = "        professionalServices: { include: { service: true } },"
          old3 = "        reviews: true,"
          new3 = "        review: true,"
          if s.count(old1) != 0:
              s = s.replace(old1, new1, 1)
          if s.count(old2) != 0:
              s = s.replace(old2, new2, 1)
          if s.count(old3) != 0:
              s = s.replace(old3, new3, 1)
          p.write_text(s)
          PY
          grep -n "professionalServices\|review: true\|services: { include\|reviews: true" backend/src/admin/admin.service.ts | head -30
      - name: Verify build
        run: |
          cd backend
          npm install
          npx prisma generate
          npm run build
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-admin-relations.yml
          git add backend/src/admin/admin.service.ts
          git commit -m "fix(admin): align Prisma relations with schema"
          git push origin HEAD:main
