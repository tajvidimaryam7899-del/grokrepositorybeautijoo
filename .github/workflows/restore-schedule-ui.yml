name: Restore schedule UI
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/restore-schedule.py'
      - '.tmp-restore/**'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore files
        run: python3 scripts/restore-schedule.py
      - name: Commit
        run: |
          git config user.name "Beautijoo Bot"
          git config user.email "bot@beautijoo.ir"
          git add frontend/src/app/zibagar/hours/page.tsx frontend/src/lib/panel-api.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(zibagar): restore full schedule hours page and panel-api"
          git push origin main
